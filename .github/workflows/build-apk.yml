name: Build Artelligence Android APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode Release Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.p12
      - name: Build Signed Release APK
        env:
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: gradle assembleRelease --no-daemon
      - name: Package Artelligence APK & Compatibility Alias
        run: |
          cp app/build/outputs/apk/release/app-release.apk Artelligence.apk
          cp app/build/outputs/apk/release/app-release.apk VisualsAdmin.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artelligence-android-apk
          path: Artelligence.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Artelligence Super-App v2.0.${{ github.run_number }}
          files: |
            Artelligence.apk
            VisualsAdmin.apk
          generate_release_notes: true
